    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      /* 統一底色 #181c25：不論弧形光暈實際涵蓋範圍多大，露出來的都是設計本身的底色，不會再出現突兀黑邊 */
      background-color: #181c25;
    }

    body {
      color: #f8fafc;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .font-zen { font-family: 'Zen Maru Gothic', sans-serif; }
    .font-logo { font-family: 'Cyber Graph', 'Inter', sans-serif; font-weight: 400; }
    .font-youyuan { font-family: '\5E7C\5713', 'Ubuntu Condensed', 'Inter', sans-serif; }
    .font-abyssinica { font-family: 'Abyssinica SIL', 'Inter', sans-serif; }
    .font-ubuntu-condensed { font-family: 'Ubuntu Condensed', 'Inter', sans-serif; }
    .aspect-poster { aspect-ratio: 2 / 3; }

    /* NEONE Movie Insights 漸層文字：色票／方向依你提供的 code 原樣還原 */
    .gradient-text {
      background: linear-gradient(90deg, rgba(168,222,247,1) 0%, rgba(136,222,245,1) 36%, rgba(107,222,244,1) 63%, rgba(148,187,246,1) 92%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }

    /* 圓弧劃過動畫 (左下 -> 右下)：首頁進場與電影卡 loading 共用 */
    @keyframes drawArc {
      0% { stroke-dashoffset: 3000; opacity: 0; }
      10% { opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 1; }
    }
    .animate-draw-arc {
      stroke-dasharray: 3000;
      stroke-dashoffset: 3000;
      animation: drawArc 1.3s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    .btn-lumine-primary {
      background: #ffffff;
      color: #030712;
      font-weight: 600;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.65), 0 0 15px rgba(255, 255, 255, 0.9);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-lumine-primary:hover {
      box-shadow: 0 0 42px rgba(56, 189, 248, 0.95);
      transform: translateY(-2px) scale(1.02);
    }

    /* 偏好篩選按鈕（頁首）：bg #222939 / border #424856，依 code 還原 */
    .btn-filter-trigger {
      background: #222939;
      border: 1px solid #424856;
      color: #ffffff;
      transition: all 0.2s ease;
    }
    .btn-filter-trigger:hover { border-color: #6990a4; }

    /* 偏好篩選面板（頁內卡片，非 Modal） */
    .filter-dialog {
      background: #222939;
      border: 1px solid #424856;
    }
    .filter-select {
      background: #181c25;
      border: 1px solid #424856;
      color: #ffffff;
    }
    .filter-select:focus { border-color: #6990a4; outline: none; }

    /* 自訂下拉選單：類型／語系兩個欄位用的膠囊按鈕＋選項清單 */
    .select-trigger { cursor: pointer; text-align: left; transition: border-color 0.2s ease; }
    .select-trigger:hover { border-color: #6990a4; }
    .custom-select.is-open .select-trigger { border-color: #6990a4; }
    .custom-select.is-open .select-chevron { transform: rotate(180deg); }

    .select-options {
      background: #181c25;
      border: 1px solid #424856;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6);
    }
    .select-option {
      padding: 10px 16px;
      font-size: 0.8125rem;
      color: #cbd5e1;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }
    .select-option:hover { background: rgba(105, 144, 164, 0.18); color: #f8fafc; }
    .select-option.is-selected { background: rgba(105, 144, 164, 0.25); color: #98bfd2; font-weight: 600; }
  </style>
</head>
<body class="h-screen overflow-hidden bg-[#181c25]">

  <!-- 整個首頁包在 overflow-hidden 的容器裡：底色統一是 #181c25，
       弧形光暈只是疊加在上面的裝飾層，露出來的一律是設計本身的顏色，不會有黑邊 -->
  <div class="relative w-full h-full flex flex-col overflow-hidden">

    <!-- 背景弧形光暈：對應 code 中 ellipse-95.svg 的位置與尺寸比例（top 19.8% / height 80.2%） -->
    <div class="absolute inset-x-0 top-[19%] h-[80%] pointer-events-none z-0" aria-hidden="true">
      <svg class="w-full h-full" viewBox="0 0 1440 700" preserveAspectRatio="none" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="arcFill" gradientUnits="userSpaceOnUse" cx="720" cy="700" r="900"
                          gradientTransform="translate(720 700) scale(1 0.521739) translate(-720 -700)">
            <stop offset="41%" stop-color="#1C4563" stop-opacity="1"/>
            <stop offset="50%" stop-color="#113551" stop-opacity="1"/>
            <stop offset="61%" stop-color="#0D2D45" stop-opacity="1"/>
            <stop offset="68%" stop-color="#09273D" stop-opacity="1"/>
            <stop offset="77%" stop-color="#0C273A" stop-opacity="1"/>
            <stop offset="83%" stop-color="#0A2333" stop-opacity="1"/>
            <stop offset="89%" stop-color="#0B2A3C" stop-opacity="1"/>
            <stop offset="93%" stop-color="#11344B" stop-opacity="1"/>
            <stop offset="100%" stop-color="#166196" stop-opacity="1"/>
          </radialGradient>

          <linearGradient id="arcStroke" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="6%" stop-color="#6990A4" stop-opacity="1"/>
            <stop offset="50%" stop-color="#98BFD2" stop-opacity="1"/>
            <stop offset="100%" stop-color="#6990A4" stop-opacity="1"/>
          </linearGradient>

          <filter id="arcDropShadow" x="-150%" y="-150%" width="400%" height="400%">
            <feMorphology in="SourceAlpha" operator="dilate" radius="50" result="spread"/>
            <feGaussianBlur in="spread" stdDeviation="75" result="shadowBlur"/>
            <feFlood flood-color="#1B698F" flood-opacity="1" result="shadowColor"/>
            <feComposite in="shadowColor" in2="shadowBlur" operator="in" result="shadow"/>
            <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="lineSoft"/>
            <feMerge>
              <feMergeNode in="shadow"/>
              <feMergeNode in="lineSoft"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>

        <g filter="url(#arcDropShadow)">
          <path id="arc-fill" d="M -200 700 A 920 480 0 0 1 1640 700 Z" fill="url(#arcFill)" class="opacity-0 transition-opacity duration-1000"/>
          <path id="arc-line" d="M -200 700 A 920 480 0 0 1 1640 700" fill="none" stroke="url(#arcStroke)" stroke-width="2.5"/>
        </g>
      </svg>
    </div>

    <!-- 頂部 Header：保留原本左上角 logo，右上角偏好篩選改為開啟 Modal -->
    <header class="relative z-10 w-full flex justify-between items-center px-6 md:px-10 lg:px-12 pt-7 pb-4">

      <a href="#" id="header-logo" class="opacity-0 transition-opacity duration-1000 flex items-center gap-2.5 cursor-pointer" title="回到首頁">
        <span class="text-cyan-400 text-base filter drop-shadow-[0_0_8px_rgba(56,189,248,0.9)]">✦✦</span>
        <span class="font-logo text-base sm:text-lg tracking-[0.15em] text-slate-100">NE <span class="text-cyan-400">⊙</span> NE</span>
      </a>

      <button id="header-filter" type="button" aria-haspopup="dialog" aria-expanded="false"
              class="opacity-0 transition-opacity duration-1000 btn-filter-trigger px-3.5 py-1.5 rounded-full flex items-center gap-2 text-xs font-normal font-youyuan tracking-[0.05em]">
        <i class="fa-solid fa-sliders text-cyan-400 text-xs"></i>
        <span>偏好篩選</span>
      </button>
    </header>

    <!-- 主內容區塊 -->
    <main class="relative z-10 flex-1 w-full flex flex-col items-center justify-center text-center px-6">

      <div class="w-full max-w-4xl flex flex-col items-center mt-[100px]">

        <div id="hero-state" class="w-full flex flex-col items-center">
          <h1 class="font-zen font-normal text-[#def0f9] text-3xl sm:text-5xl lg:text-[70px] tracking-[0.08em] leading-tight">
            <span id="part-build-faster" class="opacity-0 transition-opacity duration-1000">Build Faster </span><span id="part-with" class="opacity-0 transition-opacity duration-1000">With</span>
          </h1>

          <h2 class="font-zen font-normal text-3xl sm:text-5xl lg:text-[70px] tracking-[0.08em] leading-tight mt-[30px]">
            <span id="part-neone" class="gradient-text opacity-0 transition-opacity duration-1000">NEONE </span><span id="part-movie-insights" class="gradient-text opacity-0 transition-opacity duration-1000">Movie Insights</span>
          </h2>

          <p id="hero-desc" class="opacity-0 transition-opacity duration-1000 font-youyuan text-[#87abc6] text-xs sm:text-sm lg:text-[19px] tracking-[0.05em] leading-relaxed max-w-2xl lg:max-w-none lg:whitespace-nowrap mt-[65px]">
            擺脫選擇困難症，點擊下方按鈕，即刻從全球 <span class="font-abyssinica">TMDb</span> 資料庫中為你隨機抽選一部優質電影。
          </p>
        </div>

        <!-- 推薦電影結果：無外框卡片，海報＋資訊直接置於光暈背景上 -->
        <div id="result-card" class="hidden w-full max-w-2xl mx-auto text-left my-2">
          <div class="flex flex-col sm:flex-row gap-7 sm:gap-8 items-center sm:items-start">

            <div class="relative w-36 sm:w-44 shrink-0">
              <img id="movie-poster" src="" alt="電影海報"
                   onerror="this.onerror=null; this.src='https://placehold.co/400x600/181c25/38bdf8?text=Poster+Unavailable';"
                   class="w-full aspect-poster object-cover rounded-2xl shadow-[0_25px_60px_rgba(0,0,0,0.85)]">

              <div class="absolute -top-2 -right-2 bg-[#181c25]/95 backdrop-blur-md px-2.5 py-0.5 rounded-full text-xs font-extrabold text-amber-400 border border-amber-400/40 flex items-center gap-1 z-10 shadow-lg">
                <i class="fa-solid fa-star text-[10px]"></i>
                <span id="movie-rating">0.0</span>
              </div>
            </div>

            <div class="flex-1 space-y-2.5 text-center sm:text-left">
              <div>
                <div class="flex items-baseline justify-center sm:justify-between flex-wrap gap-2">
                  <h2 id="movie-title" class="text-lg sm:text-2xl font-extrabold text-white tracking-wide drop-shadow-[0_0_20px_rgba(56,189,248,0.25)]"></h2>
                  <span id="movie-year" class="text-xs font-bold text-cyan-400"></span>
                </div>
                <p id="movie-original-title" class="text-[11px] text-slate-400 italic pt-0.5"></p>
              </div>

              <div class="flex items-center justify-center sm:justify-start gap-2 flex-wrap">
                <span id="movie-genre-tag" class="px-2 py-0.5 rounded bg-cyan-950/70 border border-cyan-500/40 text-cyan-300 text-[10px] font-semibold"></span>
                <span id="movie-lang-tag" class="px-2 py-0.5 rounded bg-slate-800/70 border border-slate-600/50 text-slate-300 text-[10px] font-semibold"></span>
              </div>

              <p class="text-xs text-[#87abc6]">
                <span class="text-slate-500">主演：</span><span id="movie-cast"></span>
              </p>

              <div class="pt-2 border-t border-slate-700/50">
                <h3 class="text-[11px] font-bold text-cyan-400 uppercase tracking-wider mb-1 flex items-center justify-center sm:justify-start gap-1.5">
                  <i class="fa-solid fa-align-left text-[9px]"></i> 劇情簡介
                </h3>
                <p id="movie-overview" class="text-xs sm:text-sm text-slate-200 leading-relaxed font-normal"></p>
              </div>
            </div>

          </div>
        </div>

        <div id="recommend-btn-container" class="opacity-0 transition-opacity duration-1000 flex items-center justify-center mt-[140px]">
          <button id="recommend-btn" type="button" class="btn-lumine-primary font-ubuntu-condensed px-7 py-3 rounded-full text-sm tracking-[0.05em] flex items-center justify-center gap-2.5">
            <i class="fa-solid fa-wand-magic-sparkles text-cyan-600" id="btn-icon"></i>
            <span id="btn-text">請推薦我電影</span>
          </button>
        </div>

      </div>

      <p class="sr-only" aria-live="polite" role="status" id="sr-announcement"></p>
    </main>

    <!-- 頁尾 -->
    <footer class="relative z-10 w-full text-center py-5 border-t border-[#424856]/40">
      <p class="text-[11px] text-[#87abc6] font-sans tracking-widest">© NEONE CINEMA AI • POWERED BY TMDB API</p>
    </footer>

  </div>

  <!-- 偏好篩選 Modal：依你提供的 code 還原（遮罩＋置中對話框） -->
  <div id="filter-modal" class="hidden fixed inset-0 z-50 items-center justify-center bg-black/50" role="presentation">
    <section class="filter-dialog w-[420px] max-w-[90vw] rounded-[20px] p-8 text-white shadow-2xl"
              role="dialog" aria-modal="true" aria-labelledby="filter-dialog-title">
      <div class="flex items-center justify-between">
        <h2 id="filter-dialog-title" class="font-youyuan text-2xl tracking-[0.06em]">偏好篩選</h2>
        <button type="button" id="filter-close" class="text-2xl leading-none text-[#def0f9] cursor-pointer" aria-label="關閉偏好篩選">×</button>
      </div>

      <form id="filter-form" class="mt-6 space-y-5 font-youyuan">
        <label class="block text-[#def0f9]">
          電影類型
          <select id="filter-genre" class="filter-select mt-2 block w-full rounded-lg px-3 py-2">
            <option value="">不限類型</option>
            <option value="28">動作</option>
            <option value="35">喜劇</option>
            <option value="18">劇情</option>
            <option value="878">科幻</option>
          </select>
        </label>
        <label class="block text-[#def0f9]">
          年份
          <select id="filter-year" class="filter-select mt-2 block w-full rounded-lg px-3 py-2">
            <option value="">不限年份</option>
            <option value="2020s">2020 年代</option>
            <option value="2010s">2010 年代</option>
            <option value="2000s">2000 年代</option>
            <option value="before-2000">2000 年以前</option>
          </select>
        </label>
        <button type="submit" class="w-full rounded-full bg-white py-3 text-black shadow-[0_0_20px_rgba(255,255,255,0.4)] cursor-pointer font-ubuntu-condensed">
          套用篩選
        </button>
      </form>
    </section>
  </div>

  <script>
    const TMDB_API_KEY = 'f1baea1a64768c2ace8585a66ad8fbdc';

    const genreDict = { 18: "劇情", 53: "驚悚", 878: "科幻", 16: "動畫", 27: "恐怖", 35: "喜劇", 28: "動作" };
    const langDict = { ko: "韓語", ja: "日語", en: "英語", zh: "華語", cn: "華語" };
    const yearRanges = {
      '2020s': ['2020-01-01', '2029-12-31'],
      '2010s': ['2010-01-01', '2019-12-31'],
      '2000s': ['2000-01-01', '2009-12-31'],
      'before-2000': ['1900-01-01', '1999-12-31']
    };

    const arcLine = document.getElementById('arc-line');
    const arcFill = document.getElementById('arc-fill');

    function playArcSweep() {
      arcFill.classList.add('opacity-0');
      arcLine.classList.remove('animate-draw-arc');
      void arcLine.offsetWidth;
      requestAnimationFrame(() => {
        arcLine.classList.add('animate-draw-arc');
        arcFill.classList.remove('opacity-0');
      });
    }

    /* =========================================================
       進場動畫：5 個階段
       階段1 (0ms)    : 畫面淨空，僅背景
       階段2 (100ms)  : 弧線從左下劃至右下，底層藍色光暈同步浮現
       階段3 (500ms)  : Fade in 'Build Faster' 與 'Movie Insights'
       階段4 (1800ms) : Fade in 'With' 與 'NEONE'
       階段5 (2600ms) : Fade in 左上角 Logo、偏好篩選、副標題、請推薦電影 Button
       ========================================================= */
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => { playArcSweep(); }, 100);

      setTimeout(() => {
        document.getElementById('part-build-faster').classList.remove('opacity-0');
        document.getElementById('part-movie-insights').classList.remove('opacity-0');
      }, 500);

      setTimeout(() => {
        document.getElementById('part-with').classList.remove('opacity-0');
        document.getElementById('part-neone').classList.remove('opacity-0');
      }, 1800);

      setTimeout(() => {
        document.getElementById('header-logo').classList.remove('opacity-0');
        document.getElementById('header-filter').classList.remove('opacity-0');
        document.getElementById('hero-desc').classList.remove('opacity-0');
        document.getElementById('recommend-btn-container').classList.remove('opacity-0');
      }, 2600);
    });

    const headerLogo = document.getElementById('header-logo');
    const recommendBtn = document.getElementById('recommend-btn');
    const btnText = document.getElementById('btn-text');
    const btnIcon = document.getElementById('btn-icon');
    const heroState = document.getElementById('hero-state');
    const resultCard = document.getElementById('result-card');
    const srAnnouncement = document.getElementById('sr-announcement');

    const headerFilter = document.getElementById('header-filter');
    const filterModal = document.getElementById('filter-modal');
    const filterClose = document.getElementById('filter-close');
    const filterForm = document.getElementById('filter-form');
    const filterGenre = document.getElementById('filter-genre');
    const filterYear = document.getElementById('filter-year');

    const moviePoster = document.getElementById('movie-poster');
    const movieTitle = document.getElementById('movie-title');
    const movieOriginalTitle = document.getElementById('movie-original-title');
    const movieYear = document.getElementById('movie-year');
    const movieRating = document.getElementById('movie-rating');
    const movieGenreTag = document.getElementById('movie-genre-tag');
    const movieLangTag = document.getElementById('movie-lang-tag');
    const movieOverview = document.getElementById('movie-overview');
    const movieCast = document.getElementById('movie-cast');

    headerLogo.addEventListener('click', (e) => {
      e.preventDefault();
      resultCard.classList.add('hidden');
      heroState.classList.remove('hidden');
      btnText.textContent = "請推薦我電影";
      btnIcon.className = "fa-solid fa-wand-magic-sparkles text-cyan-600";
    });

    function openFilterModal() {
      filterModal.classList.remove('hidden');
      filterModal.classList.add('flex');
      headerFilter.setAttribute('aria-expanded', 'true');
    }
    function closeFilterModal() {
      filterModal.classList.add('hidden');
      filterModal.classList.remove('flex');
      headerFilter.setAttribute('aria-expanded', 'false');
    }

    headerFilter.addEventListener('click', openFilterModal);
    filterClose.addEventListener('click', closeFilterModal);
    filterModal.addEventListener('mousedown', (e) => {
      if (e.target === filterModal) closeFilterModal();
    });
    filterForm.addEventListener('submit', (e) => {
      e.preventDefault();
      closeFilterModal();
      srAnnouncement.textContent = '偏好篩選已套用';
    });

    async function fetchRandomMovieFromTMDb() {
      const genre = filterGenre.value;
      const yearKey = filterYear.value;

      let baseUrl = `https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_API_KEY}&language=zh-TW&sort_by=popularity.desc&vote_count.gte=50&include_adult=false`;

      if (genre) baseUrl += `&with_genres=${genre}`;
      if (yearKey && yearRanges[yearKey]) {
        const [gte, lte] = yearRanges[yearKey];
        baseUrl += `&primary_release_date.gte=${gte}&primary_release_date.lte=${lte}`;
      }

      try {
        const res1 = await fetch(`${baseUrl}&page=1`);
        const data1 = await res1.json();

        if (!data1.results || data1.results.length === 0) {
          alert("沒有找到符合該條件的電影，請放寬篩選條件！");
          return null;
        }

        const totalPages = Math.min(data1.total_pages || 1, 30);
        const randomPage = Math.floor(Math.random() * totalPages) + 1;

        const res2 = await fetch(`${baseUrl}&page=${randomPage}`);
        const data2 = await res2.json();

        const validMovies = (data2.results || []).filter(m => m.poster_path && m.overview);
        if (validMovies.length === 0) return data1.results[0];

        const randomIndex = Math.floor(Math.random() * validMovies.length);
        return validMovies[randomIndex];
      } catch (error) {
        console.error("TMDb API Error:", error);
        alert("無法連線至 TMDb API，請檢查網路連線！");
        return null;
      }
    }

    async function fetchMovieCast(movieId) {
      try {
        const res = await fetch(`https://api.themoviedb.org/3/movie/${movieId}/credits?api_key=${TMDB_API_KEY}&language=zh-TW`);
        const data = await res.json();
        const names = (data.cast || []).slice(0, 3).map(c => c.name);
        return names.length ? names.join('、') : '暫無資料';
      } catch (error) {
        return '暫無資料';
      }
    }

    recommendBtn.addEventListener('click', async () => {
      heroState.classList.add('hidden');
      resultCard.classList.add('hidden');

      playArcSweep();

      btnText.textContent = "抽選中...";
      btnIcon.className = "fa-solid fa-spinner fa-spin text-cyan-600";
      recommendBtn.disabled = true;

      const [movie] = await Promise.all([
        fetchRandomMovieFromTMDb(),
        new Promise(resolve => setTimeout(resolve, 1300))
      ]);

      if (movie) {
        const castText = await fetchMovieCast(movie.id);

        moviePoster.src = `https://image.tmdb.org/t/p/w500${movie.poster_path}`;
        movieTitle.textContent = movie.title || movie.original_title;
        movieOriginalTitle.textContent = movie.original_title !== movie.title ? movie.original_title : '';
        movieYear.textContent = movie.release_date ? `(${movie.release_date.split('-')[0]})` : '';
        movieRating.textContent = movie.vote_average ? movie.vote_average.toFixed(1) : 'N/A';

        movieGenreTag.textContent = genreDict[movie.genre_ids?.[0]] || "電影";
        movieLangTag.textContent = langDict[movie.original_language] || movie.original_language.toUpperCase();
        movieOverview.textContent = movie.overview || "此電影暫無中文劇情摘要說明。";
        movieCast.textContent = castText;

        resultCard.classList.remove('hidden');
        srAnnouncement.textContent = `已為你推薦電影：${movieTitle.textContent}`;

        btnText.textContent = "再換一部 🎲";
        btnIcon.className = "fa-solid fa-rotate-right text-cyan-600";
      } else {
        heroState.classList.remove('hidden');
        btnText.textContent = "請推薦我電影";
        btnIcon.className = "fa-solid fa-wand-magic-sparkles text-cyan-600";
      }

      recommendBtn.disabled = false;
    });
  </script>
</body>
</html>
