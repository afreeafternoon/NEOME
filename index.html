<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEONE - Lumine Insights Movie AI</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 圖標 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- 導入 Cyberpunk / Minimal Tech 線型字體 (Syncopate & Megrim) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Megrim&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    /* NEONE 深邃夜空黑背景 */
    body {
      background-color: #030712;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* CYBERGRAPH 風格字體 */
    .font-cybergraph {
      font-family: 'Syncopate', 'Megrim', sans-serif;
    }

    /* 2:3 標準電影海報比例 */
    .aspect-poster {
      aspect-ratio: 2 / 3;
    }

    /* 背景：緊貼底部的超大邊緣發光半圓形 */
    .bottom-semicircle-glow {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 130vw;
      max-width: 960px;
      height: 340px;
      border-radius: 1000px 1000px 0 0;
      background: radial-gradient(ellipse at bottom, rgba(56, 189, 248, 0.35) 0%, rgba(14, 165, 233, 0.1) 60%, transparent 85%);
      border-top: 2.5px solid rgba(186, 230, 253, 0.95);
      border-left: 2px solid rgba(56, 189, 248, 0.4);
      border-right: 2px solid rgba(56, 189, 248, 0.4);
      box-shadow: 
        0 -20px 80px rgba(56, 189, 248, 0.65),
        0 -5px 30px rgba(14, 165, 233, 0.4),
        inset 0 30px 70px rgba(56, 189, 248, 0.25);
      pointer-events: none;
      z-index: 0;
    }

    /* 背景大氣微光 */
    .bg-light-pillars {
      background-image: 
        radial-gradient(ellipse 700px 450px at 50% 20%, rgba(56, 189, 248, 0.15), transparent),
        radial-gradient(ellipse 500px 350px at 50% 80%, rgba(99, 102, 241, 0.1), transparent);
    }

    /* 精緻白光主按鈕 */
    .btn-lumine-primary {
      background: #ffffff;
      color: #030712;
      font-weight: 700;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.4), 0 0 10px rgba(56, 189, 248, 0.3);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-lumine-primary:hover {
      box-shadow: 0 0 35px rgba(56, 189, 248, 0.7);
      transform: translateY(-2px) scale(1.02);
    }
    .btn-lumine-primary:active {
      transform: scale(0.97);
    }

    /* 暗色玻璃次要按鈕 */
    .btn-lumine-secondary {
      background: rgba(15, 23, 42, 0.85);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      transition: all 0.2s ease;
    }
    .btn-lumine-secondary:hover {
      border-color: rgba(56, 189, 248, 0.5);
      background: rgba(30, 41, 59, 0.95);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.25);
    }

    /* 通用玻璃面板 */
    .glass-card {
      background: rgba(10, 15, 29, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
    }

    /* 專屬電影卡片：高遮光不透明背景（防止背景藍光透穿） */
    .opaque-movie-card {
      background: #0a0f1d !important;
      border: 1px solid rgba(56, 189, 248, 0.35);
      box-shadow: 
        0 30px 70px rgba(0, 0, 0, 0.9),
        0 0 30px rgba(14, 165, 233, 0.2),
        inset 0 1px 1px rgba(255, 255, 255, 0.15);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-fade {
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="min-h-screen bg-light-pillars relative overflow-x-hidden flex flex-col justify-between items-center px-4 sm:px-6">

  <!-- 頂部 Header：左上角 Logo（可點擊回首頁）/ 右上角 偏好篩選 -->
  <header class="w-full max-w-3xl flex justify-between items-center z-50 pt-6 pb-4">
    
    <!-- 左上角 Logo（加上 cursor-pointer 與點擊回首頁觸發） -->
    <a href="#" id="logo-btn" class="flex items-center gap-2 sm:gap-3 cursor-pointer group transition-opacity hover:opacity-85" title="回到首頁">
      <span class="text-cyan-400 text-lg sm:text-2xl leading-none filter drop-shadow-[0_0_8px_rgba(56,189,248,0.9)]">✦✦</span>
      
      <!-- CYBERGRAPH 精密向量 SVG LOGO -->
      <svg class="h-6 sm:h-8 w-auto" viewBox="0 0 160 28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 24V4L18 24V4" stroke="#F1F5F9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M42 4H28V24H44 M28 14H38" stroke="#F1F5F9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="68" cy="14" r="10" stroke="#38BDF8" stroke-width="2"/>
        <circle cx="68" cy="14" r="2.5" fill="#38BDF8"/>
        <path d="M92 24V4L106 24V4" stroke="#F1F5F9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M130 4H116V24H132 M116 14H126" stroke="#F1F5F9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
    
    <!-- 右上角 控制鈕 -->
    <button id="toggle-filter-btn" class="btn-lumine-secondary px-3.5 sm:px-4 py-1.5 sm:py-2 rounded-full flex items-center gap-2 text-xs sm:text-sm font-medium text-slate-300 hover:text-white">
      <i class="fa-solid fa-sliders text-cyan-400 text-xs"></i>
      <span>偏好篩選</span>
    </button>
  </header>

  <!-- 可摺疊篩選面板（等比例收窄至 max-w-3xl） -->
  <div id="filter-panel" class="hidden w-full max-w-3xl glass-card rounded-2xl p-4 sm:p-5 my-2 z-40 space-y-4 border-cyan-500/20">
    <div class="flex justify-between items-center pb-2 border-b border-slate-800">
      <span class="text-xs sm:text-sm font-semibold text-slate-300 flex items-center gap-2">
        <i class="fa-solid fa-filter text-cyan-400"></i> 設定 TMDb 篩選條件
      </span>
      <button id="reset-filter" class="text-xs text-cyan-400 hover:underline">重置條件</button>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs sm:text-sm">
      <div>
        <label class="block text-slate-400 mb-1.5">電影類型</label>
        <select id="filter-genre" class="w-full bg-slate-900/90 text-slate-200 border border-slate-700/80 rounded-xl p-2.5 outline-none focus:border-cyan-400">
          <option value="">全部類型</option>
          <option value="18">劇情片</option>
          <option value="53">驚悚片</option>
          <option value="878">科幻片</option>
          <option value="16">動畫片</option>
          <option value="27">恐怖片</option>
          <option value="35">喜劇片</option>
          <option value="28">動作片</option>
        </select>
      </div>
      <div>
        <label class="block text-slate-400 mb-1.5">發音語系</label>
        <select id="filter-lang" class="w-full bg-slate-900/90 text-slate-200 border border-slate-700/80 rounded-xl p-2.5 outline-none focus:border-cyan-400">
          <option value="">全部語系</option>
          <option value="ko">韓語</option>
          <option value="ja">日語</option>
          <option value="en">英語</option>
          <option value="zh">華語</option>
        </select>
      </div>
    </div>
  </div>

  <!-- 主內容區塊（限制最大寬度 max-w-3xl 增加視覺品質） -->
  <main class="w-full max-w-3xl my-auto py-6 flex flex-col items-center justify-center z-10 space-y-5 text-center relative">

    <div class="w-full flex flex-col items-center text-center relative">
      
      <!-- 未抽取狀態：標題區域 -->
      <div id="hero-state" class="space-y-4 px-2 max-w-xl py-6">
        <h1 class="text-2xl sm:text-4xl font-extrabold tracking-tight leading-tight text-white">
          Build Faster With<br>
          <span class="bg-clip-text text-transparent bg-gradient-to-r from-sky-200 via-cyan-300 to-indigo-300">
            NEONE Movie Insights
          </span>
        </h1>

        <p class="text-xs sm:text-sm text-slate-400 max-w-md mx-auto leading-relaxed pt-1">
          擺脫選擇困難症。點擊下方按鈕，即刻從全球 TMDb 資料庫中為你隨機抽選一部優質電影。
        </p>
      </div>

      <!-- 載入中狀態 -->
      <div id="loading-state" class="hidden flex-col items-center justify-center space-y-3 py-10">
        <div class="w-9 h-9 border-2 border-cyan-400 border-t-transparent rounded-full animate-spin"></div>
        <p class="text-xs font-medium text-cyan-300 animate-pulse tracking-widest">SEARCHING TMDB DATABASE...</p>
      </div>

      <!-- 推薦電影結果卡片（尺寸精緻化 max-w-3xl，海報獨立 RWD 不切邊） -->
      <div id="result-card" class="hidden w-full opaque-movie-card rounded-2xl p-5 sm:p-6 text-left my-2 animate-fade z-20">
        <div class="grid grid-cols-1 sm:grid-cols-12 gap-5 sm:gap-6 items-center">
          
          <!-- 左側海報：自動套用 2:3 比例，限制尺寸不強行擴展，精緻呈現 -->
          <div class="sm:col-span-4 flex justify-center">
            <div class="relative w-full max-w-[190px] sm:max-w-none aspect-poster rounded-xl overflow-hidden bg-slate-950 shadow-xl border border-slate-800">
              <img id="movie-poster" src="" alt="電影海報" 
                   onerror="this.onerror=null; this.src='https://placehold.co/400x600/0f172a/38bdf8?text=Poster+Unavailable';" 
                   class="w-full h-full object-cover">
              
              <div class="absolute top-2 left-2 bg-slate-950/90 backdrop-blur-md px-2 py-0.5 rounded text-[10px] font-bold text-cyan-300 border border-cyan-500/40 z-10">
                <span id="movie-lang-tag"></span>
              </div>

              <div class="absolute top-2 right-2 bg-slate-950/90 backdrop-blur-md px-2 py-0.5 rounded text-xs font-extrabold text-amber-400 border border-amber-400/40 flex items-center gap-1 z-10">
                <i class="fa-solid fa-star text-[10px]"></i>
                <span id="movie-rating">0.0</span>
              </div>
            </div>
          </div>

          <!-- 右側詳細資訊 -->
          <div class="sm:col-span-8 space-y-3">
            <div>
              <div class="flex items-baseline justify-between flex-wrap gap-2">
                <h2 id="movie-title" class="text-lg sm:text-xl font-extrabold text-white tracking-wide"></h2>
                <span id="movie-year" class="text-xs font-bold text-cyan-400"></span>
              </div>
              <p id="movie-original-title" class="text-[11px] text-slate-400 italic pt-0.5"></p>
            </div>

            <div class="flex items-center gap-2">
              <span id="movie-genre-tag" class="px-2 py-0.5 rounded bg-cyan-950 border border-cyan-500/40 text-cyan-300 text-[10px] font-semibold"></span>
            </div>

            <div class="pt-2.5 border-t border-slate-800">
              <h3 class="text-[11px] font-bold text-cyan-400 uppercase tracking-wider mb-1 flex items-center gap-1.5">
                <i class="fa-solid fa-align-left text-[9px]"></i> 劇情簡介
              </h3>
              <p id="movie-overview" class="text-xs sm:text-sm text-slate-200 leading-relaxed font-normal line-clamp-6 sm:line-clamp-none"></p>
            </div>
          </div>

        </div>
      </div>

      <!-- 主按鈕：請推薦我電影 -->
      <div class="flex items-center justify-center pt-3 z-30">
        <button id="recommend-btn" class="btn-lumine-primary px-6 py-2.5 rounded-full text-xs sm:text-sm tracking-wide flex items-center justify-center gap-2">
          <i class="fa-solid fa-wand-magic-sparkles text-cyan-600" id="btn-icon"></i>
          <span id="btn-text">請推薦我電影</span>
        </button>
      </div>

    </div>

    <!-- 超大邊緣發光半圓形 -->
    <div class="bottom-semicircle-glow"></div>

  </main>

  <!-- 頁尾 -->
  <footer class="w-full max-w-3xl text-center z-10 py-4 border-t border-slate-800/40">
    <p class="text-[11px] text-slate-500 font-sans">© NEONE Cinema AI • Powered by TMDb API</p>
  </footer>

  <script>
    const TMDB_API_KEY = 'f1baea1a64768c2ace8585a66ad8fbdc';

    const genreDict = {
      18: "劇情", 53: "驚悚", 878: "科幻", 16: "動畫", 
      27: "恐怖", 35: "喜劇", 28: "動作"
    };

    const langDict = {
      ko: "韓語", ja: "日語", en: "英語", zh: "華語", cn: "華語"
    };

    const logoBtn = document.getElementById('logo-btn');
    const recommendBtn = document.getElementById('recommend-btn');
    const btnText = document.getElementById('btn-text');
    const btnIcon = document.getElementById('btn-icon');
    const heroState = document.getElementById('hero-state');
    const loadingState = document.getElementById('loading-state');
    const resultCard = document.getElementById('result-card');
    
    const toggleFilterBtn = document.getElementById('toggle-filter-btn');
    const filterPanel = document.getElementById('filter-panel');
    const filterGenre = document.getElementById('filter-genre');
    const filterLang = document.getElementById('filter-lang');
    const resetFilter = document.getElementById('reset-filter');

    const moviePoster = document.getElementById('movie-poster');
    const movieTitle = document.getElementById('movie-title');
    const movieOriginalTitle = document.getElementById('movie-original-title');
    const movieYear = document.getElementById('movie-year');
    const movieRating = document.getElementById('movie-rating');
    const movieGenreTag = document.getElementById('movie-genre-tag');
    const movieLangTag = document.getElementById('movie-lang-tag');
    const movieOverview = document.getElementById('movie-overview');

    // 點擊 Logo 回首頁功能
    logoBtn.addEventListener('click', (e) => {
      e.preventDefault();
      resultCard.classList.add('hidden');
      loadingState.classList.add('hidden');
      heroState.classList.remove('hidden');
      btnText.textContent = "請推薦我電影";
      btnIcon.className = "fa-solid fa-wand-magic-sparkles text-cyan-600";
    });

    toggleFilterBtn.addEventListener('click', () => filterPanel.classList.toggle('hidden'));
    resetFilter.addEventListener('click', () => { filterGenre.value = ""; filterLang.value = ""; });

    async function fetchRandomMovieFromTMDb() {
      const genre = filterGenre.value;
      const lang = filterLang.value;

      let baseUrl = `https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_API_KEY}&language=zh-TW&sort_by=popularity.desc&vote_count.gte=50&include_adult=false`;
      
      if (genre) baseUrl += `&with_genres=${genre}`;
      if (lang) baseUrl += `&with_original_language=${lang}`;

      try {
        const res1 = await fetch(`${baseUrl}&page=1`);
        const data1 = await res1.json();

        if (!data1.results || data1.results.length === 0) {
          alert("沒有找到符合該條件的電影，請放寬篩選條件！");
          return null;
        }

        const totalPages = Math.min(data1.total_pages || 1, 30);
        const randomPage = Math.floor(Math.random() * totalPages) + 1;

        const res2 = await fetch(`${baseUrl}&page=${randomPage}`);
        const data2 = await res2.json();

        const validMovies = (data2.results || []).filter(m => m.poster_path && m.overview);
        if (validMovies.length === 0) return data1.results[0];

        const randomIndex = Math.floor(Math.random() * validMovies.length);
        return validMovies[randomIndex];
      } catch (error) {
        console.error("TMDb API Error:", error);
        alert("無法連線至 TMDb API，請檢查網路連線！");
        return null;
      }
    }

    recommendBtn.addEventListener('click', async () => {
      heroState.classList.add('hidden');
      resultCard.classList.add('hidden');
      loadingState.classList.remove('hidden');
      loadingState.classList.add('flex');

      btnText.textContent = "抽選中...";
      btnIcon.className = "fa-solid fa-spinner fa-spin text-cyan-600";
      recommendBtn.disabled = true;

      const [movie] = await Promise.all([
        fetchRandomMovieFromTMDb(),
        new Promise(resolve => setTimeout(resolve, 800))
      ]);

      loadingState.classList.add('hidden');
      loadingState.classList.remove('flex');

      if (movie) {
        moviePoster.src = `https://image.tmdb.org/t/p/w500${movie.poster_path}`;
        movieTitle.textContent = movie.title || movie.original_title;
        movieOriginalTitle.textContent = movie.original_title !== movie.title ? movie.original_title : '';
        movieYear.textContent = movie.release_date ? `(${movie.release_date.split('-')[0]})` : '';
        movieRating.textContent = movie.vote_average ? movie.vote_average.toFixed(1) : 'N/A';
        
        movieGenreTag.textContent = genreDict[movie.genre_ids?.[0]] || "電影";
        movieLangTag.textContent = langDict[movie.original_language] || movie.original_language.toUpperCase();
        movieOverview.textContent = movie.overview || "此電影暫無中文劇情摘要說明。";

        resultCard.classList.remove('hidden');

        btnText.textContent = "再換一部 🎲";
        btnIcon.className = "fa-solid fa-rotate-right text-cyan-600";
      } else {
        heroState.classList.remove('hidden');
        btnText.textContent = "請推薦我電影";
        btnIcon.className = "fa-solid fa-wand-magic-sparkles text-cyan-600";
      }

      recommendBtn.disabled = false;
    });
  </script>
</body>
</html>
