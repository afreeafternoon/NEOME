<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- ============================================================
       Content-Security-Policy（內容安全政策）
       ============================================================
       限制這個網頁只能載入下面列出的信任來源，降低被注入惡意腳本、
       被嵌入他人網站當 iframe 冒用等風險。

       這裡有兩個先天限制，來自這個網站的架構本身，先說明清楚：
       1. style-src 裡的 'unsafe-inline' 沒辦法拿掉——因為 Tailwind CDN
          是在瀏覽器裡即時把用到的 class 編譯成一份 <style> 標籤動態插入頁面，
          屬於「執行期動態產生的內嵌樣式」。CSP 若要放行這種動態內容，
          正規做法是用 nonce，但 nonce 需要伺服器在每次回應時產生一個新亂數，
          GitHub Pages 這種純靜態託管沒有伺服器端邏輯，沒辦法做到。
          如果之後想拿掉這個限制，作法是把 Tailwind 事先編譯成一份固定的
          .css 檔案自己託管，而不是用這個即時編譯的 CDN 版本。
       2. frame-ancestors／sandbox 這幾個指令只有透過「伺服器回應標頭」
          設定才會真正生效，寫在 <meta> 標籤裡瀏覽器會直接忽略。
          GitHub Pages 不開放自訂回應標頭，這裡保留寫法是方便之後
          若換到能自訂標頭的主機時直接沿用，但目前不會真的產生作用。
       ============================================================ -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' https://image.tmdb.org https://placehold.co data:; media-src 'self' data:; connect-src https://api.themoviedb.org; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none';">

  <title>NEONE - Movie Insights AI</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 圖標 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- 字體：Zen Maru Gothic（標題）、Inter（內文）、Ubuntu Condensed（按鈕）、Abyssinica SIL（TMDb 字樣） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Zen+Maru+Gothic:wght@400;500;700&family=Ubuntu+Condensed&family=Abyssinica+SIL&display=swap" rel="stylesheet">

  <!-- 自訂樣式，拆分至獨立檔案方便管理，見 style.css -->
  <link rel="stylesheet" href="style.css">
</head>
</head>
<body class="min-h-screen bg-[#181c25]">

  <!-- 整個首頁包在這個容器裡：底色統一是 #181c25，弧形光暈只是疊加在上面的裝飾層。
       容器改用 min-h-screen（而非固定 h-full + overflow-hidden），
       這樣電影資訊較長、超出一個畫面高度時，頁面會自然往下撐開並可以捲動查看，
       不會像過去那樣整個被鎖死在單一畫面高度內滑不動。 -->
  <div class="relative w-full min-h-screen flex flex-col">

    <!-- 環境暈染：獨立於弧線 SVG 之外，永遠鋪滿整個畫面高度，負責讓弧線下方（尤其手機直向、
         畫面較高時）不會出現一整片沒有漸層、看起來像被截斷的空白區域。這層不影響弧線本身的
         形狀比例，純粹是背景的漸層延伸，讓整個畫面「看起來」有被填滿。 -->
    <div class="fixed inset-0 pointer-events-none z-0" aria-hidden="true"
         style="background: radial-gradient(ellipse 140% 100% at 50% 0%, rgba(28,69,99,0.32) 0%, rgba(20,45,69,0.15) 45%, rgba(24,28,37,0) 100%);"></div>

    <!-- 背景弧形光暈：改回單純的固定定位（不再用JS即時量測、動態調整容器高度），
         這樣視窗縮放或iOS Safari捲動時的工具列顯示/隱藏都不會觸發重新計算，
         避免在效能較弱的手機上造成主執行緒卡頓。 -->
    <div class="fixed inset-0 pointer-events-none z-0" aria-hidden="true">
      <svg class="w-full h-full" viewBox="0 0 1440 700" preserveAspectRatio="xMidYMax slice" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="arcFill" gradientUnits="userSpaceOnUse" cx="720" cy="700" r="900"
                          gradientTransform="translate(720 700) scale(1 0.380435) translate(-720 -700)">
            <stop offset="41%" stop-color="#1C4563" stop-opacity="1"/>
            <stop offset="50%" stop-color="#113551" stop-opacity="1"/>
            <stop offset="61%" stop-color="#0D2D45" stop-opacity="1"/>
            <stop offset="68%" stop-color="#09273D" stop-opacity="1"/>
            <stop offset="77%" stop-color="#0C273A" stop-opacity="1"/>
            <stop offset="83%" stop-color="#0A2333" stop-opacity="1"/>
            <stop offset="89%" stop-color="#0B2A3C" stop-opacity="1"/>
            <stop offset="93%" stop-color="#11344B" stop-opacity="1"/>
            <stop offset="100%" stop-color="#166196" stop-opacity="1"/>
          </radialGradient>

          <linearGradient id="arcStroke" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="6%" stop-color="#6990A4" stop-opacity="1"/>
            <stop offset="50%" stop-color="#98BFD2" stop-opacity="1"/>
            <stop offset="100%" stop-color="#6990A4" stop-opacity="1"/>
          </linearGradient>

          <!-- 簡化過的柔光濾鏡：只保留一層 feGaussianBlur，拿掉原本的 feMorphology(dilate)。
               dilate 在 WebKit/iOS Safari 上是公認很吃效能的濾鏡運算，
               尤其套用在弧線這種「很寬很扁」的形狀上容易造成嚴重的渲染延遲甚至卡死，
               拿掉之後光暈會稍微柔和一點、但效能穩定許多。 -->
          <filter id="arcDropShadow" x="-10%" y="-60%" width="120%" height="220%" color-interpolation-filters="sRGB">
            <feGaussianBlur in="SourceGraphic" stdDeviation="6"/>
          </filter>
        </defs>

        <g filter="url(#arcDropShadow)">
          <path id="arc-fill" class="arc-fill-el opacity-0 transition-opacity duration-1000" d="M -200 700 A 920 350 0 0 1 1640 700 Z" fill="url(#arcFill)"/>
          <path id="arc-line" class="arc-line-el" d="M -200 700 A 920 350 0 0 1 1640 700" fill="none" stroke="url(#arcStroke)" stroke-width="1.1"/>
        </g>
      </svg>
    </div>


    <!-- 頂部 Header：保留原本左上角 logo，右上角偏好篩選改為開啟 Modal -->
    <header class="relative z-10 w-full flex justify-between items-stretch px-6 md:px-10 lg:px-12 pt-7 pb-4">

      <a href="#" id="header-logo" class="opacity-0 transition-opacity duration-1000 flex items-center gap-2.5 cursor-pointer" title="回到首頁">
        <span class="text-cyan-400 text-xl filter drop-shadow-[0_0_8px_rgba(56,189,248,0.9)] site-logo-icon">✦✦</span>
        <span class="font-logo text-[28px] tracking-[0.15em] text-slate-100 site-logo-text">NE <span class="text-cyan-400">⊙</span> NE</span>
      </a>

      <button id="header-filter" type="button" aria-haspopup="dialog" aria-expanded="false"
              class="opacity-0 transition-opacity duration-1000 btn-filter-trigger header-filter-btn px-3.5 py-1.5 rounded-full flex items-center gap-2 text-xs font-normal font-youyuan tracking-[0.05em]">
        <i class="fa-solid fa-sliders text-cyan-400 text-xs"></i>
        <span>偏好篩選</span>
      </button>
    </header>

    <!-- 主內容區塊 -->
    <main class="relative z-10 flex-1 w-full flex flex-col items-center text-center px-6">

      <!-- 內容置中區：只有這個區塊會依照目前顯示的畫面（首頁標題／篩選面板／電影資訊卡）的高度來置中，
           按鈕被移到這個區塊「外面」，兩者互不影響。 -->
      <div class="flex-1 w-full flex flex-col items-center justify-center">

        <div class="w-full max-w-4xl flex flex-col items-center mt-[100px]">

        <div id="hero-state" class="w-full flex flex-col items-center">
          <h1 id="hero-line-1" class="font-zen font-normal text-[#def0f9] hero-title-fluid tracking-[0.08em] leading-tight whitespace-nowrap">
            <span id="part-build-faster" class="opacity-0 transition-opacity duration-1000">Build Faster </span><span id="part-with" class="opacity-0 transition-opacity duration-1000">With</span>
          </h1>

          <h2 id="hero-line-2" class="font-zen font-normal hero-title-fluid hero-title-gap-fluid tracking-[0.08em] leading-tight whitespace-nowrap">
            <span id="part-neone" class="gradient-text opacity-0 transition-opacity duration-1000">NEONE </span><span id="part-movie-insights" class="gradient-text opacity-0 transition-opacity duration-1000">Movie Insights</span>
          </h2>

          <p id="hero-desc" class="opacity-0 transition-opacity duration-1000 font-youyuan text-[#87abc6] hero-desc-fluid tracking-[0.05em] leading-relaxed mt-[65px]">
            擺脫選擇困難症，點擊下方按鈕，<br class="lg:hidden">即刻從全球 <span class="font-abyssinica">TMDb</span> 資料庫中為你隨機抽選一部優質電影。
          </p>
        </div>

        <!-- 偏好篩選面板（頁內卡片，取代原本的 Modal，依你提供的 code 還原：標題／重置條件／類型＋語系兩個下拉） -->
        <div id="filter-panel" class="hidden w-full flex flex-col items-center transition-opacity duration-[800ms]">
          <div class="relative text-left filter-panel-card" style="width:960px; max-width:100%; background: rgba(30,37,50,0.90); border: 1px solid #303A4A; border-radius: 10px;">

            <!-- 標題列：篩選圖示＋今天有什麼想法？，右側重置條件 -->
            <div class="flex items-center justify-between">
              <div class="flex items-center" style="gap:9px;">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M3.33333 2.5H16.6667C16.8877 2.5 17.0996 2.5878 17.2559 2.74408C17.4122 2.90036 17.5 3.11232 17.5 3.33333V4.655C17.5 4.876 17.4121 5.08792 17.2558 5.24417L11.9108 10.5892C11.7545 10.7454 11.6667 10.9573 11.6667 11.1783V16.4325C11.6666 16.5591 11.6378 16.684 11.5822 16.7977C11.5267 16.9115 11.446 17.0111 11.3463 17.089C11.2465 17.167 11.1303 17.2211 11.0065 17.2474C10.8827 17.2737 10.7545 17.2715 10.6317 17.2408L8.965 16.8242C8.78464 16.7792 8.6245 16.6752 8.51004 16.5287C8.39558 16.3823 8.33338 16.2017 8.33333 16.0158V11.1783C8.33329 10.9573 8.24546 10.7454 8.08917 10.5892L2.74417 5.24417C2.58788 5.08792 2.50005 4.876 2.5 4.655V3.33333C2.5 3.11232 2.5878 2.90036 2.74408 2.74408C2.90036 2.5878 3.11232 2.5 3.33333 2.5Z" fill="#31BED5" stroke="#41C0D5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span class="font-zen filter-heading-text" style="color:#ffffff; font-size:18px; font-weight:400; letter-spacing:0.9px;">今天有什麼想法？</span>
              </div>
              <button type="button" id="reset-filter" class="reset-link font-youyuan" style="font-size:15px; font-weight:400; letter-spacing:0.75px;">重置條件</button>
            </div>

            <!-- 分隔線 -->
            <div class="mx-auto" style="width:100%; max-width:908px; height:0; border-top:1px solid #303A4A; margin-top:18px; margin-bottom:20px;"></div>

            <!-- 類型／語系 兩欄 -->
            <div class="flex flex-col sm:flex-row" style="gap:20px;">
              <div class="custom-select relative w-full sm:flex-1 sm:min-w-0" data-select="genre">
                <div class="font-youyuan filter-field-label" style="color:#ffffff; font-size:18px; font-weight:400; letter-spacing:0.9px; margin-bottom:10px;">電影類型</div>
                <button type="button" class="select-trigger dropdown-trigger w-full flex items-center justify-between font-youyuan">
                  <span class="select-label">不限類型</span>
                  <svg class="select-chevron transition-transform duration-200" width="12" height="7" viewBox="0 0 12 7" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M4.94959 5.8925L-0.000282569 1.17833L1.23697 -4.32732e-07L5.56822 4.125L9.89947 -5.40819e-08L11.1367 1.17833L6.18684 5.8925C6.02276 6.04873 5.80024 6.13649 5.56822 6.13649C5.3362 6.13649 5.11368 6.04873 4.94959 5.8925Z" fill="#E0E6ED"/>
                  </svg>
                </button>
                <div class="select-options hidden absolute left-0 right-0 mt-2 rounded-[5px] z-50">
                  <div class="select-option is-selected" data-value="">不限類型</div>
                  <div class="select-option" data-value="28">動作</div>
                  <div class="select-option" data-value="35">喜劇</div>
                  <div class="select-option" data-value="18">劇情</div>
                  <div class="select-option" data-value="878">科幻</div>
                  <div class="select-option" data-value="27">恐怖</div>
                  <div class="select-option" data-value="10749">愛情</div>
                  <div class="select-option" data-value="99">紀錄</div>
                  <div class="select-option" data-value="53">驚悚</div>
                </div>
              </div>

              <div class="custom-select relative w-full sm:flex-1 sm:min-w-0" data-select="lang">
                <div class="font-youyuan filter-field-label" style="color:#ffffff; font-size:18px; font-weight:400; letter-spacing:0.9px; margin-bottom:10px;">語系</div>
                <button type="button" class="select-trigger dropdown-trigger w-full flex items-center justify-between font-youyuan">
                  <span class="select-label">不限語系</span>
                  <svg class="select-chevron transition-transform duration-200" width="12" height="7" viewBox="0 0 12 7" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M4.94959 5.8925L-0.000282569 1.17833L1.23697 -4.32732e-07L5.56822 4.125L9.89947 -5.40819e-08L11.1367 1.17833L6.18684 5.8925C6.02276 6.04873 5.80024 6.13649 5.56822 6.13649C5.3362 6.13649 5.11368 6.04873 4.94959 5.8925Z" fill="#E0E6ED"/>
                  </svg>
                </button>
                <div class="select-options hidden absolute left-0 right-0 mt-2 rounded-[5px] z-50">
                  <div class="select-option is-selected" data-value="">不限語系</div>
                  <div class="select-option" data-value="ko">韓語</div>
                  <div class="select-option" data-value="ja">日語</div>
                  <div class="select-option" data-value="en">英語</div>
                  <div class="select-option" data-value="zh">華語</div>
                  <div class="select-option" data-value="th">泰語</div>
                  <div class="select-option" data-value="vi">越語</div>
                  <div class="select-option" data-value="fr">法語</div>
                  <div class="select-option" data-value="de">德語</div>
                  <div class="select-option" data-value="ru">俄語</div>
                  <div class="select-option" data-value="hi">印度語</div>
                  <div class="select-option" data-value="es">西班牙語</div>
                  <div class="select-option" data-value="it">義大利語</div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- 推薦電影結果：無外框卡片，海報＋資訊直接置於光暈背景上 -->
        <div id="result-card" class="hidden w-full max-w-[900px] mx-auto text-left -mt-[17px] mb-2 sm:my-2 transition-opacity duration-[800ms]">
          <div class="flex flex-col sm:flex-row gap-8 sm:gap-9 items-center">

            <div class="relative w-[194px] sm:w-[250px] shrink-0 -mt-6 sm:mt-0">
              <img id="movie-poster" src="" alt="電影海報"
                   class="w-full aspect-poster object-cover rounded-[10px] shadow-[0_25px_60px_rgba(0,0,0,0.85)]">

              <div class="absolute -top-2 -right-2 bg-[#181c25]/95 backdrop-blur-md px-2.5 py-0.5 rounded-full text-xs font-extrabold text-amber-400 border border-amber-400/40 flex items-center gap-1 z-10 shadow-lg">
                <i class="fa-solid fa-star text-[10px]"></i>
                <span id="movie-rating">0.0</span>
              </div>
            </div>

            <div class="flex-1 min-w-0 space-y-3 text-center sm:text-left">
              <!-- 語系標籤：行動端改用絕對定位貼右上角，不佔用版面寬度，
                   這樣中文片名／年份／英文片名才能相對整張卡片的完整寬度「真正置中」，
                   而不是像先前的兩欄 grid 那樣只在被擠壓後的半寬區塊內置中。
                   sm 以上（平板／桌機）用 sm:static 還原成原本的正常堆疊排列（標籤在標題下方，sm:mt-3 補回原本間距），桌機外觀完全不變。 -->
              <div class="relative sm:static">
                <div>
                  <div class="flex items-baseline justify-center sm:justify-between flex-wrap gap-2">
                    <h2 id="movie-title" class="text-[15px] sm:text-[25px] font-extrabold text-white tracking-wide drop-shadow-[0_0_20px_rgba(56,189,248,0.25)]"></h2>
                    <span id="movie-year" class="text-xs font-bold text-cyan-400"></span>
                  </div>
                  <p id="movie-original-title" class="text-xs text-slate-400 italic pt-0.5"></p>
                </div>

                <div class="absolute top-0 right-0 flex items-center gap-2 flex-wrap sm:static sm:justify-start sm:mt-3">
                  <span id="movie-lang-tag" class="px-2.5 py-1 rounded bg-cyan-950/70 border border-cyan-500/40 text-cyan-300 text-[13px] font-semibold"></span>
                </div>
              </div>

              <div class="text-xs sm:text-sm space-y-1">
                <p><span style="color:#7C8B9E;">導演：</span><span id="movie-director" style="color:#F1F5F9;"></span></p>
                <p><span style="color:#7C8B9E;">主演：</span><span id="movie-cast" style="color:#F1F5F9;"></span></p>
              </div>

              <div class="pt-2 border-t border-slate-700/50">
                <h3 class="text-xs font-bold text-cyan-400 uppercase tracking-wider mb-1 flex items-center justify-start gap-1.5">
                  <i class="fa-solid fa-align-left text-xs"></i> 劇情簡介
                </h3>
                <p id="movie-overview" class="overview-clamp text-xs sm:text-sm text-slate-200 leading-relaxed font-normal"></p>
                <button type="button" id="overview-toggle" class="hidden mt-1.5 text-xs text-cyan-400 hover:underline font-youyuan">顯示完整劇情</button>
              </div>
            </div>

          </div>
        </div>

        </div>

      </div>

      <!-- 按鈕：獨立於內容置中區之外，用固定距離貼齊頁尾方向，
           不管上面顯示的是首頁標題、篩選面板、還是電影資訊卡，這裡的位置永遠一致。 -->
      <div id="recommend-btn-container" class="opacity-0 transition-opacity duration-1000 flex items-center justify-center pb-[66px] sm:pb-24">
        <button id="recommend-btn" type="button" class="btn-lumine-primary btn-recommend-fluid font-ubuntu-condensed rounded-full tracking-[0.05em] flex items-center justify-center gap-2.5">
          <i class="fa-solid fa-wand-magic-sparkles text-cyan-600" id="btn-icon"></i>
          <span id="btn-text">請推薦我電影</span>
        </button>
      </div>

      <p class="sr-only" aria-live="polite" role="status" id="sr-announcement"></p>
    </main>

    <!-- 頁尾 -->
    <footer class="relative z-10 w-full text-center py-5 border-t border-[#424856]/40">
      <p class="text-[11px] text-[#87abc6] font-sans tracking-widest">© NEONE CINEMA AI • POWERED BY TMDB API</p>
    </footer>

  </div>

  <!-- 互動邏輯，拆分至獨立檔案方便管理，見 app.js。defer 確保 DOM 都解析完成後才執行 -->
  <script src="app.js" defer></script>
</body>
</html>
